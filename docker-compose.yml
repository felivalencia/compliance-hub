services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: compliance
      POSTGRES_PASSWORD: compliance
      POSTGRES_DB: compliance_hub
    ports: [ "5432:5432" ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U compliance -d compliance_hub" ]
      interval: 3s
      timeout: 2s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports: [ "6379:6379" ]

  api:
    build: ./apps/api
    env_file:
      - ./apps/api/.env.example
    environment:
      DATABASE_URL: postgresql://compliance:compliance@postgres:5432/compliance_hub?schema=public
      ADMIN_API_KEY: dev-admin-123
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
    ports: [ "4000:4000" ]
    command: sh -c "pnpm prisma migrate deploy && pnpm db:seed && pnpm start:prod"

  web:
    build: ./apps/web
    environment:
      VITE_API_BASE_URL: http://localhost:4000
    depends_on:
      - api
    ports: [ "5173:5173" ]

volumes:
  pgdata:
